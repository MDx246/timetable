<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางสอน 2569 — โรงเรียนดอนสีนวนฯ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1a3a6b; --blue:#2e6db4; --blue-lt:#d9e8f7; --blue-md:#4a90d9;
  --purple:#5c3d99; --purp-lt:#eee8f8; --purp-md:#8060bb;
  --amber:#7d5700; --amber-lt:#fff9e6;
  --orange:#7d4000; --org-lt:#ffe8cc;
  --teal:#0f5c52; --teal-lt:#e0f4f1;
  --green:#2e7d32; --grn-lt:#e8f5e9;
  --red:#c62828;
  --bg:#f4f6fb; --surface:#fff; --border:#dde3ee;
  --text:#1a2233; --muted:#6b7a99;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* HEADER */
header{background:var(--navy);color:#fff;padding:18px 28px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(26,58,107,.22);}
.header-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.school-icon{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.school-name{font-size:15px;font-weight:600;}
.school-sub{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px;}
.mode-tabs{display:flex;gap:2px;}
.mode-tab{padding:8px 22px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);border-radius:8px 8px 0 0;transition:all .18s;}
.mode-tab.active{background:var(--bg);color:var(--navy);}
.mode-tab:hover:not(.active){background:rgba(255,255,255,.16);color:#fff;}

/* FILTER BAR */
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 28px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px;white-space:nowrap;}
.chip{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-size:12.5px;font-family:inherit;font-weight:500;color:var(--text);cursor:pointer;transition:all .14s;white-space:nowrap;}
.chip:hover{border-color:var(--blue);color:var(--blue);}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

/* MAIN */
main{padding:20px 28px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

/* TABLE */
.table-wrap{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow-x:auto;box-shadow:0 2px 8px rgba(26,58,107,.06);}
table{width:100%;border-collapse:collapse;min-width:700px;}
th,td{padding:0;border:1px solid var(--border);text-align:center;vertical-align:middle;}
.th-corner,.th-grade,.th-day,.th-teacher-hdr{background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:10px 14px;white-space:nowrap;}
.th-period{font-size:11.5px;font-weight:600;padding:7px 5px;line-height:1.4;}
.th-morning{background:var(--blue-lt);color:var(--navy);}
.th-lunch{background:var(--amber-lt);color:var(--amber);}
.th-afternoon{background:var(--org-lt);color:var(--orange);}

/* row label cells */
td.grade-label{background:var(--blue-md);color:#fff;font-weight:600;font-size:13px;padding:0 10px;white-space:nowrap;}
td.grade-label.mid{background:var(--purple);}
td.day-label{background:var(--blue);color:#fff;font-weight:600;font-size:13px;padding:8px 12px;white-space:nowrap;}
td.teacher-day-label{background:var(--teal);color:#fff;font-weight:600;font-size:13px;padding:8px 12px;white-space:nowrap;}

/* subject cells */
.cell-subject{padding:7px 5px;font-size:12px;line-height:1.3;}
tr:nth-child(even) .cell-subject{background:#f7f9fd;}
.cell-subject .subj{font-weight:600;font-size:12px;display:block;}
.cell-subject .meta{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;}
.cell-subject.special{background:var(--purp-lt)!important;}
.cell-subject.special .subj{color:var(--purple);}
.cell-subject.special .meta{color:var(--purp-md);}
.cell-lunch{background:var(--amber-lt);color:var(--amber);font-size:11px;font-weight:500;padding:7px 4px;font-style:italic;}
.cell-free{background:#f9fafc;color:#c0c8d8;font-size:11px;padding:7px 4px;}

/* TEACHER STATS */
.teacher-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:120px;text-align:center;}
.stat-num{font-size:22px;font-weight:600;color:var(--navy);}
.stat-label{font-size:11.5px;color:var(--muted);margin-top:2px;}

@media(max-width:600px){header{padding:14px 16px 0;}main{padding:14px 16px;}.filter-bar{padding:10px 16px;}}
</style>
</head>

  "สุณิษา":{"จันทร์":[{"subj":"วิทย์","grade":"ป.2"},null,{"subj":"วิทย์","grade":"ป.3"},{"subj":"วิทย์","grade":"ป.1"},{"subj":"ต้านทุจริต","grade":"ป.5"},{"subj":"วิทย์","grade":"ป.6"}],"อังคาร":[null,null,{"subj":"วิทย์","grade":"ป.1"},{"subj":"วิทย์","grade":"ป.5"},{"subj":"หน้าที่พลเมือง","grade":"ป.5"},{"subj":"วิทย์พลังสิบ","grade":"ป.6"}],"พุธ":[null,null,null,{"subj":"วิทย์","grade":"ป.2"},{"subj":"ต้านทุจริต","grade":"ป.6"},null],"พฤหัสบดี":[{"subj":"วิทย์","grade":"ป.4"},{"subj":"วิทย์","grade":"ป.5"},{"subj":"วิทย์","grade":"ป.3"},null,{"subj":"อังกฤษสื่อสาร","grade":"ป.4"},null],"ศุกร์":[{"subj":"วิทย์","grade":"ป.6"},null,{"subj":"อังกฤษสื่อสาร","grade":"ป.4"},null,{"subj":"วิทย์","grade":"ป.4"},null]},
  "อนรรฆ":{"จันทร์":[null,null,{"subj":"พละ","grade":"ป.4"},{"subj":"สุขศึกษา","grade":"ป.2"},null,{"subj":"สุขศึกษา","grade":"ม.3"}],"อังคาร":[null,{"subj":"สุขศึกษา","grade":"ม.2"},null,{"subj":"สุขศึกษา","grade":"ป.3"},{"subj":"พละ","grade":"ม.2"},{"subj":"เกษตร","grade":"ป.5"}],"พุธ":[{"subj":"พละ","grade":"ป.6"},{"subj":"สุขศึกษา","grade":"ป.1"},null,{"subj":"สุขศึกษา","grade":"ป.5"},{"subj":"พละ","grade":"ป.5"},null],"พฤหัสบดี":[null,{"subj":"พละ","grade":"ม.3"},null,{"subj":"ต้านทุจริต","grade":"ป.3"},{"subj":"สุขศึกษา","grade":"ม.1"},null],"ศุกร์":[{"subj":"สุขศึกษา","grade":"ป.4"},null,{"subj":"สุขศึกษา","grade":"ป.6"},{"subj":"ต้านทุจริต","grade":"ป.2"},{"subj":"พละ","grade":"ม.1"},null]},
  "อุบลวรรณ":{"จันทร์":[{"subj":"ไทย","grade":"ป.1"},{"subj":"คณิต","grade":"ป.1"},{"subj":"อังกฤษ","grade":"ป.1"},null,{"subj":"ต้านทุจริต","grade":"ป.1"},{"subj":"ลดเวลาเรียน","grade":"ป.1"}],"อังคาร":[{"subj":"ไทย","grade":"ป.1"},{"subj":"คณิต","grade":"ป.1"},null,null,{"subj":"อังกฤษ","grade":"ป.1"},{"subj":"หน้าที่พลเมือง","grade":"ป.1"}],"พุธ":[{"subj":"ไทย","grade":"ป.1"},null,{"subj":"คณิต","grade":"ป.1"},{"subj":"อังกฤษ","grade":"ป.1"},null,null],"พฤหัสบดี":[{"subj":"ไทย","grade":"ป.1"},null,{"subj":"คณิต","grade":"ป.1"},null,{"subj":"อังกฤษ","grade":"ป.1"},null],"ศุกร์":[{"subj":"ไทย","grade":"ป.1"},{"subj":"คณิต","grade":"ป.1"},{"subj":"อังกฤษ","grade":"ป.1"},{"subj":"งานบ้าน","grade":"ป.1"},null,null]},
};

const ALL_TEACHERS=Object.keys(TEACHER_DATA).sort();

// เพิ่มคาบพิเศษให้ทุกคน (ครูทุกคนมีร่วมกัน)
const SHARED_PERIODS = {
  "พุธ":    { idx: 5, subj: "ชุมนุม",          grade: "ทุกชั้น" },
  "พฤหัสบดี": { idx: 5, subj: "ลูกเสือ",         grade: "ทุกชั้น" },
  "ศุกร์":  { idx: 5, subj: "อบรมสุดสัปดาห์", grade: "ทุกชั้น" },
};
ALL_TEACHERS.forEach(t => {
  Object.entries(SHARED_PERIODS).forEach(([day, {idx, subj, grade}]) => {
    TEACHER_DATA[t][day][idx] = { subj, grade };
  });
});

let mode='day', selected='จันทร์';

function parse(raw){const[s,t]=raw.split('|');return{subj:s||'',teacher:t?t.replace(/[()]/g,''):''};}
function isSpecial(s){return SPECIAL.has(s);}

function periodHeaderRow(){
  return PERIODS.map(p=>`<th class="th-period th-${p.type}">${p.label}<br><small>${p.time}</small></th>`).join('');
}

function subjectCell(raw,evenRow){
  if(!raw)return'<td class="cell-subject'+(evenRow?' even':'')+'" style="background:'+(evenRow?'#f7f9fd':'#fff')+'"></td>';
  const{subj,teacher}=parse(raw);
  const sp=isSpecial(subj)?'special':'';
  const bg=sp?'':(evenRow?'background:#f7f9fd':'background:#fff');
  return`<td class="cell-subject ${sp}" style="${bg}">
    <span class="subj">${subj}</span>
    ${teacher?`<span class="meta">${teacher}</span>`:''}
  </td>`;
}

function buildDayView(){
  let h=`<div class="table-wrap"><table><thead><tr><th class="th-corner">ชั้น</th>${periodHeaderRow()}</tr></thead><tbody>`;
  GRADES.forEach((g,i)=>{
    const mid=g.startsWith('ม');
    const even=i%2===1;
    h+=`<tr><td class="grade-label${mid?' mid':''}">${g}</td>`;
    const s=DATA[selected][g];
    h+=subjectCell(s[0],even)+subjectCell(s[1],even)+subjectCell(s[2],even);
    h+=`<td class="cell-lunch">🍽<br>พัก</td>`;
    h+=subjectCell(s[3],even)+subjectCell(s[4],even)+subjectCell(s[5],even);
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function buildGradeView(){
  let h=`<div class="table-wrap"><table><thead><tr><th class="th-corner">วัน</th>${periodHeaderRow()}</tr></thead><tbody>`;
  DAYS.forEach((d,i)=>{
    const even=i%2===1;
    h+=`<tr><td class="day-label">${d}</td>`;
    const s=DATA[d][selected];
    h+=subjectCell(s[0],even)+subjectCell(s[1],even)+subjectCell(s[2],even);
    h+=`<td class="cell-lunch">🍽<br>พัก</td>`;
    h+=subjectCell(s[3],even)+subjectCell(s[4],even)+subjectCell(s[5],even);
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function buildTeacherView(){
  const td=TEACHER_DATA[selected];
  let totalPeriods=0;
  const gradeSet=new Set();
  const subjSet=new Set();
  DAYS.forEach(d=>{
    td[d].forEach(p=>{
      if(p){totalPeriods++;gradeSet.add(p.grade);subjSet.add(p.subj);}
    });
  });

  let h=`<div class="teacher-stats">
    <div class="stat-card"><div class="stat-num">${totalPeriods}</div><div class="stat-label">คาบ/สัปดาห์</div></div>
    <div class="stat-card"><div class="stat-num">${gradeSet.size}</div><div class="stat-label">ชั้นที่สอน</div></div>
    <div class="stat-card"><div class="stat-num">${subjSet.size}</div><div class="stat-label">วิชาที่สอน</div></div>
    <div class="stat-card" style="text-align:left;min-width:160px">
      <div class="stat-label" style="margin-bottom:5px">ชั้นที่สอน</div>
      <div style="font-size:12px;color:var(--text);line-height:1.7">${[...gradeSet].join(', ')}</div>
    </div>
  </div>`;

  h+=`<div class="table-wrap"><table><thead><tr><th class="th-corner">วัน</th>${periodHeaderRow()}</tr></thead><tbody>`;
  DAYS.forEach((d,i)=>{
    const even=i%2===1;
    const bg=even?'#f7f9fd':'#fff';
    h+=`<tr><td class="teacher-day-label">${d}</td>`;
    // periods 0-2 = morning, 3-5 = afternoon (index in TEACHER_DATA)
    [0,1,2].forEach(pi=>{
      const p=td[d][pi];
      if(p){
        const isMid=p.grade.startsWith('ม');
        const badgeBg=isMid?'var(--purp-lt)':'var(--blue-lt)';
        const badgeFg=isMid?'var(--purple)':'var(--navy)';
        h+=`<td class="cell-subject" style="background:${bg}">
          <span class="subj">${p.subj}</span>
          <span class="meta" style="background:${p.grade==='ทุกชั้น'?'var(--purp-lt)':badgeBg};color:${p.grade==='ทุกชั้น'?'var(--purple)':badgeFg};border-radius:4px;padding:1px 5px;font-size:10px;margin-top:3px;display:inline-block">${p.grade}</span>
        </td>`;
      }else{
        h+=`<td class="cell-free" style="background:${bg}">—</td>`;
      }
    });
    h+=`<td class="cell-lunch">🍽<br>พัก</td>`;
    [3,4,5].forEach(pi=>{
      const p=td[d][pi];
      if(p){
        const isMid=p.grade.startsWith('ม');
        const badgeBg=isMid?'var(--purp-lt)':'var(--blue-lt)';
        const badgeFg=isMid?'var(--purple)':'var(--navy)';
        h+=`<td class="cell-subject" style="background:${bg}">
          <span class="subj">${p.subj}</span>
          <span class="meta" style="background:${p.grade==='ทุกชั้น'?'var(--purp-lt)':badgeBg};color:${p.grade==='ทุกชั้น'?'var(--purple)':badgeFg};border-radius:4px;padding:1px 5px;font-size:10px;margin-top:3px;display:inline-block">${p.grade}</span>
        </td>`;
      }else{
        h+=`<td class="cell-free" style="background:${bg}">—</td>`;
      }
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function buildFilterBar(){
  const items=mode==='day'?DAYS:mode==='grade'?GRADES:ALL_TEACHERS;
  const label=mode==='day'?'วัน :':mode==='grade'?'ชั้น :':'ครู :';
  let h=`<span class="filter-label">${label}</span>`;
  items.forEach(item=>{
    h+=`<button class="chip${item===selected?' active':''}" onclick="selectItem('${item}')">${item}</button>`;
  });
  document.getElementById('filter-bar').innerHTML=h;
}

function buildLegend(){
  const base=`<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--blue-lt);border:1px solid #b5d4f4"></div>ช่วงเช้า</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--amber-lt);border:1px solid #f9cb75"></div>พักกลางวัน</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--org-lt);border:1px solid #f9c28a"></div>ช่วงบ่าย</div>`;
  if(mode!=='teacher'){
    return base+`<div class="legend-item"><div class="legend-dot" style="background:var(--purp-lt);border:1px solid #c9b8ef"></div>กิจกรรมพิเศษ</div></div>`;
  }
  return base+`<div class="legend-item"><div class="legend-dot" style="background:var(--blue-lt);border:1px solid #b5d4f4"></div>ป. (ประถม)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--purp-lt);border:1px solid #c9b8ef"></div>ม. (มัธยม)</div></div>`;
}

function render(){
  const content=mode==='day'?buildDayView():mode==='grade'?buildGradeView():buildTeacherView();
  document.getElementById('main-content').innerHTML=buildLegend()+content;
  buildFilterBar();
}

function setMode(m){
  mode=m;
  selected=m==='day'?'จันทร์':m==='grade'?'ป.1':ALL_TEACHERS[0];
  document.querySelectorAll('.mode-tab').forEach((el,i)=>{
    el.classList.toggle('active',(i===0&&m==='day')||(i===1&&m==='grade')||(i===2&&m==='teacher'));
  });
  render();
}

function selectItem(item){selected=item;render();}
render();
</script>
</body>
</html>
