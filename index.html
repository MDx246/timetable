<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางสอน 2569 — โรงเรียนดอนสีนวนฯ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --navy:#1a3a6b;--blue:#2e6db4;--blue-lt:#d9e8f7;--blue-md:#4a90d9;
  --purple:#5c3d99;--purp-lt:#eee8f8;--purp-md:#8060bb;
  --amber:#7d5700;--amber-lt:#fff9e6;
  --orange:#7d4000;--org-lt:#ffe8cc;
  --teal:#0f5c52;
  --bg:#f4f6fb;--surface:#fff;--border:#dde3ee;
  --text:#1a2233;--muted:#6b7a99;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--navy);color:#fff;padding:18px 28px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(26,58,107,.22);}
.header-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.school-icon{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.school-name{font-size:15px;font-weight:600;}
.school-sub{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px;}
.mode-tabs{display:flex;gap:2px;}
.mode-tab{padding:8px 22px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);border-radius:8px 8px 0 0;transition:all .18s;}
.mode-tab.active{background:var(--bg);color:var(--navy);}
.mode-tab:hover:not(.active){background:rgba(255,255,255,.16);color:#fff;}
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 28px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px;white-space:nowrap;}
.chip{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-size:12.5px;font-family:inherit;font-weight:500;color:var(--text);cursor:pointer;transition:all .14s;white-space:nowrap;}
.chip:hover{border-color:var(--blue);color:var(--blue);}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
main{padding:20px 28px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.table-wrap{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow-x:auto;box-shadow:0 2px 8px rgba(26,58,107,.06);}
table{width:100%;border-collapse:collapse;min-width:700px;}
th,td{padding:0;border:1px solid var(--border);text-align:center;vertical-align:middle;}
.th-corner,.th-grade,.th-day{background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:10px 14px;white-space:nowrap;}
.th-period{font-size:11.5px;font-weight:600;padding:7px 5px;line-height:1.4;}
.th-morning{background:var(--blue-lt);color:var(--navy);}
.th-lunch{background:var(--amber-lt);color:var(--amber);}
.th-afternoon{background:var(--org-lt);color:var(--orange);}
td.grade-label{background:var(--blue-md);color:#fff;font-weight:600;font-size:13px;padding:0 10px;white-space:nowrap;}
td.grade-label.mid{background:var(--purple);}
td.day-label{background:var(--blue);color:#fff;font-weight:600;font-size:13px;padding:8px 12px;white-space:nowrap;}
td.teacher-day-label{background:var(--teal);color:#fff;font-weight:600;font-size:13px;padding:8px 12px;white-space:nowrap;}
.cell-subject{padding:7px 5px;font-size:12px;line-height:1.3;}
tr:nth-child(even) .cell-subject{background:#f7f9fd;}
.cell-subject .subj{font-weight:600;font-size:12px;display:block;}
.cell-subject .meta{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;}
.cell-subject.special{background:var(--purp-lt)!important;}
.cell-subject.special .subj{color:var(--purple);}
.cell-subject.special .meta{color:var(--purp-md);}
.cell-lunch{background:var(--amber-lt);color:var(--amber);font-size:11px;font-weight:500;padding:7px 4px;font-style:italic;}
.cell-free{background:#f9fafc;color:#c0c8d8;font-size:11px;padding:7px 4px;}
.teacher-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:120px;text-align:center;}
.stat-num{font-size:22px;font-weight:600;color:var(--navy);}
.stat-label{font-size:11.5px;color:var(--muted);margin-top:2px;}
.sub-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.sub-label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;}
.sub-select{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);cursor:pointer;}
.sub-select:focus{outline:none;border-color:var(--blue);}
.sub-date-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;}
.sub-date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sub-date{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);}
.sub-date:focus{outline:none;border-color:var(--blue);}
.sub-date-weekday{font-size:12px;color:var(--muted);margin-top:6px;}
.sub-summary{margin-top:18px;}
.sub-summary-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.sub-summary-title{font-size:13px;font-weight:600;color:var(--navy);}
.summary-toolbar{display:flex;gap:8px;flex-wrap:wrap;}
.export-btn{border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.export-btn:hover{border-color:var(--blue);color:var(--blue);}
.export-btn:disabled{opacity:.5;cursor:not-allowed;}
.summary-group{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(26,58,107,.04);}
.summary-group-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px;}
.summary-group-date{font-size:14px;font-weight:600;color:var(--text);}
.summary-group-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.summary-badges{display:flex;gap:6px;flex-wrap:wrap;}
.summary-pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#f3f4f6;color:var(--muted);}
.summary-pill.primary{background:var(--blue-lt);color:var(--navy);}
.summary-item{display:grid;grid-template-columns:110px 1fr auto auto;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--border);}
.summary-item:first-of-type{border-top:none;padding-top:0;}
.summary-time{font-size:12px;font-weight:600;color:var(--navy);}
.summary-main{font-size:13px;color:var(--text);line-height:1.45;}
.summary-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.summary-grade{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--purp-lt);color:var(--purple);white-space:nowrap;}
.summary-delete{background:none;border:1px solid #fecaca;color:#dc2626;border-radius:7px;padding:4px 8px;font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap;}
.summary-delete:hover{background:#fee2e2;}
.exporting .summary-delete{display:none!important;}
.exporting .summary-item{grid-template-columns:110px 1fr auto;}
.summary-empty{background:#f9fafc;border:1px dashed var(--border);border-radius:12px;padding:16px;color:var(--muted);font-size:13px;text-align:center;}
.sub-section-title{font-size:12px;font-weight:500;color:var(--muted);margin:18px 0 8px;letter-spacing:.5px;}
.sub-original{background:#fff8e1;border:1px solid #f9c94e;border-radius:10px;padding:12px 16px;margin-bottom:10px;}
.sub-original-hdr{font-size:12px;font-weight:600;color:#7d5700;margin-bottom:6px;}
.sub-orig-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);padding:3px 0;flex-wrap:wrap;}
.sub-orig-badge{background:var(--navy);color:#fff;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:500;}
.avail-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.avail-card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s,background .15s;}
.avail-card:hover{border-color:var(--blue);}
.avail-card.picked{border-color:var(--blue);background:#f0f5ff;}
.avail-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0;}
.avail-name{font-size:13px;font-weight:600;color:var(--text);}
.avail-stat{font-size:11.5px;color:var(--muted);margin-top:1px;}
.avail-periods{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.pb{font-size:10.5px;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.pb-busy{background:#fee2e2;color:#991b1b;}
.pb-free{background:#dcfce7;color:#166534;}
.no-free{background:#f3f4f6;color:var(--muted);border-radius:10px;padding:14px 16px;font-size:13px;text-align:center;margin-bottom:10px;}
.confirm-bar{background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;margin-bottom:6px;}
.confirm-info{font-size:13px;line-height:1.5;}
.confirm-btn{background:#fff;color:var(--navy);border:none;border-radius:7px;padding:7px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
.confirm-btn:hover{background:#e8f0fb;}
.confirm-btn:disabled{background:#dbe6f5;color:#5c6f8f;cursor:default;}
.sub-period-block{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.sub-period-block:last-of-type{border-bottom:none;}
.log-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.log-table th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;font-weight:500;}
.log-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
.log-table tr:last-child td{border-bottom:none;}
.log-empty{color:var(--muted);font-size:13px;text-align:center;padding:14px;}
.del-btn{background:none;border:none;color:#dc2626;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;}
.del-btn:hover{background:#fee2e2;}
@media(max-width:600px){
  header{padding:14px 16px 0;}
  main{padding:14px 16px;}
  .filter-bar{padding:10px 16px;}
  .sub-top{grid-template-columns:1fr;}
  .avail-card{padding:10px 12px;gap:10px;}
  .avail-avatar{width:32px;height:32px;font-size:14px;}
  .avail-periods{gap:3px;margin-top:5px;}
  .pb{font-size:9.5px;padding:2px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .summary-item{grid-template-columns:88px 1fr auto;}
  .summary-grade{display:none;}
  .summary-delete{grid-column:3;grid-row:1 / span 2;align-self:center;}
}
</style>
</head>

function parse(raw){
  var parts=String(raw).split('|');
  return {subj:parts[0]||'',teacher:parts[1]?parts[1].replace(/[()]/g,''):''};
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,function(ch){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]);
  });
}

function jsArg(value){
  return JSON.stringify(String(value));
}

function createTeacherData(){
  var teachers={};
  DAYS.forEach(function(day){
    GRADES.forEach(function(grade){
      (DATA[day][grade]||[]).forEach(function(raw,periodIdx){
        if(!raw) return;
        var parsed=parse(raw);
        if(!parsed.teacher) return;
        if(!teachers[parsed.teacher]){
          teachers[parsed.teacher]={};
          DAYS.forEach(function(d){
            teachers[parsed.teacher][d]=[null,null,null,null,null,null];
          });
        }
        teachers[parsed.teacher][day][periodIdx]={subj:parsed.subj,grade:grade};
      });
    });
  });

  Object.keys(teachers).forEach(function(t){
    teachers[t]["พุธ"][5]={subj:"ชุมนุม",grade:"ทุกชั้น"};
    teachers[t]["พฤหัสบดี"][5]={subj:"ลูกเสือ",grade:"ทุกชั้น"};
    teachers[t]["ศุกร์"][5]={subj:"อบรมสุดสัปดาห์",grade:"ทุกชั้น"};
  });

  return teachers;
}

function isSpecial(s){return SPECIAL.has(s);}

function periodHeaderRow(){
  return PERIODS.map(function(p){
    return '<th class="th-period th-'+p.type+'">'+escapeHtml(p.label)+'<br><small>'+escapeHtml(p.time)+'</small></th>';
  }).join('');
}

function subjectCell(raw,even){
  if(!raw) return '<td class="cell-subject" style="background:'+(even?'#f7f9fd':'#fff')+'"></td>';
  var p=parse(raw);
  var sp=isSpecial(p.subj)?'special':'';
  var bg=sp?'':(even?'background:#f7f9fd':'background:#fff');
  return '<td class="cell-subject '+sp+'" style="'+bg+'"><span class="subj">'+escapeHtml(p.subj)+'</span>'+(p.teacher?'<span class="meta">'+escapeHtml(p.teacher)+'</span>':'')+'</td>';
}

function buildDayView(){
  var h='<div class="table-wrap"><table><thead><tr><th class="th-corner">ชั้น</th>'+periodHeaderRow()+'</tr></thead><tbody>';
  GRADES.forEach(function(g,i){
    var mid=g.startsWith('ม');
    var even=i%2===1;
    h+='<tr><td class="grade-label'+(mid?' mid':'')+'">'+escapeHtml(g)+'</td>';
    var s=DATA[selected][g];
    h+=subjectCell(s[0],even)+subjectCell(s[1],even)+subjectCell(s[2],even);
    h+='<td class="cell-lunch">🍽<br>พัก</td>';
    h+=subjectCell(s[3],even)+subjectCell(s[4],even)+subjectCell(s[5],even);
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

  }
}

function getAbsentPeriods(teacher,day){
  return TEACHER_DATA[teacher][day].map(function(s,i){return {idx:i,data:s};}).filter(function(x){return x.data;});
}
function getFreeTeachers(day,periodIdx,exclude){
  return ALL_TEACHERS.filter(function(t){
    if(t===exclude) return false;
    return !TEACHER_DATA[t][day][periodIdx];
  });
}
function avatarCol(name){
  var c=[{bg:'#dbeafe',fg:'#1e40af'},{bg:'#dcfce7',fg:'#166534'},{bg:'#fce7f3',fg:'#9d174d'},{bg:'#fef3c7',fg:'#92400e'},{bg:'#ede9fe',fg:'#5b21b6'},{bg:'#fee2e2',fg:'#991b1b'},{bg:'#e0f2fe',fg:'#075985'},{bg:'#d1fae5',fg:'#065f46'},{bg:'#fef9c3',fg:'#713f12'},{bg:'#f3e8ff',fg:'#6b21a8'}];
  return c[name.charCodeAt(0)%c.length];
}

function todayIso(){
  var d=new Date();
  var y=d.getFullYear();
  var m=String(d.getMonth()+1).padStart(2,'0');
  var day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function weekdayFromIso(iso){
  if(!iso) return 'จันทร์';
  var d=new Date(iso+'T12:00:00');
  var map=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  return map[d.getDay()]||'จันทร์';
}

function thaiDateLabel(iso){
  if(!iso) return 'ไม่ระบุวันที่';
  try{
    return new Intl.DateTimeFormat('th-TH-u-ca-buddhist', {dateStyle:'full'}).format(new Date(iso+'T12:00:00'));
  }catch(e){
    return iso;
  }
}

function timeLabelForPeriod(periodIdx){
  return PERIODS[periodIdx]?PERIODS[periodIdx].time:'';
}

function subLogKey(entry){
  return [
    entry.date||'',
    entry.day||'',
    entry.absentTeacher||'',
    Number(entry.periodIdx),
    entry.grade||'',
    entry.subject||''
  ].join('|');
}

function isCompactDevice(){
  return typeof window!=='undefined' && window.matchMedia && window.matchMedia('(max-width: 600px)').matches;
}

function canShareFile(file){
  try{
    return !!(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]})));
  }catch(e){
    return false;
  }
}

function createSummaryFile(blob){
  return new File([blob],'ตารางสรุปจัดสอนแทน-'+subDate+'.png',{type:'image/png'});
}

function syncSubDateFromInput(){
  var dayEl=document.getElementById('sub-date');
  if(dayEl){
    subDate=dayEl.value||subDate;
    subDay=weekdayFromIso(subDate);
    var weekdayEl=document.getElementById('sub-date-weekday');
    if(weekdayEl) weekdayEl.textContent=thaiDateLabel(subDate);
  }
}

function findSubLogIndex(date,day,absentTeacher,periodIdx){
  return subLog.findIndex(function(entry){
    return entry.date===date &&
      entry.day===day &&
      entry.absentTeacher===absentTeacher &&
      Number(entry.periodIdx)===Number(periodIdx);
  });
}

function getSavedSubEntry(date,day,absentTeacher,periodIdx){
  var idx=findSubLogIndex(date,day,absentTeacher,periodIdx);
  return idx>=0?subLog[idx]:null;
}

function buildSubView(){
  return '<div>'
    +'<div class="sub-top">'
    +'<div class="sub-date-wrap"><div class="sub-label">วันที่จัดสอนแทน</div>'
    +'<div class="sub-date-row"><input class="sub-date" id="sub-date" type="date" value="'+escapeHtml(subDate)+'" onchange="setSubDate(this.value)">'
    +'<div style="font-size:13px;font-weight:600;color:var(--navy)">วัน'+escapeHtml(subDay)+'</div></div>'
    +'<div class="sub-date-weekday" id="sub-date-weekday">'+escapeHtml(thaiDateLabel(subDate))+'</div></div>'
    +'<div><div class="sub-label">ครูที่ไม่ว่าง / ลา</div>'
    +'<select class="sub-select" id="sub-teacher" onchange="subAbsentTeacher=this.value;subPickedMap={};renderSubBody()">'
    +ALL_TEACHERS.map(function(t){return '<option value="'+escapeHtml(t)+'"'+(t===subAbsentTeacher?' selected':'')+'>ครู'+escapeHtml(t)+'</option>';}).join('')
    +'</select></div>'
    +'</div>'
    +'<div id="sub-body"></div>'
    +'</div>';
}

function renderSubBody(){
  var bodyEl=document.getElementById('sub-body');
  if(!bodyEl) return;
  syncSubDateFromInput();
  subAbsentTeacher=document.getElementById('sub-teacher').value;
  var absentPeriods=getAbsentPeriods(subAbsentTeacher,subDay);
  var h='';
  if(absentPeriods.length===0){
    h='<div class="no-free">ครู'+escapeHtml(subAbsentTeacher)+' ไม่มีคาบสอนวัน'+escapeHtml(subDay)+' ไม่ต้องหาครูสอนแทน</div>';
    bodyEl.innerHTML=h+renderLogHTML();
    return;
  }
  absentPeriods.forEach(function(item){
    var idx=item.idx; var data=item.data;
    var freeList=getFreeTeachers(subDay,idx,subAbsentTeacher);
    var savedEntry=getSavedSubEntry(subDate,subDay,subAbsentTeacher,idx);
    if(savedEntry && !Object.prototype.hasOwnProperty.call(subPickedMap, idx)){
      subPickedMap[idx]=savedEntry.substitute;
    }
    var picked=subPickedMap[idx]||null;
    h+='<div class="sub-period-block">';
    h+='<div class="sub-original"><div class="sub-original-hdr">📋 '+escapeHtml(PERIOD_SHORT[idx])+' · '+escapeHtml(PERIODS[idx].time)+' — ต้องหาครูสอนแทน</div>';
    h+='<div class="sub-orig-row"><span class="sub-orig-badge">'+escapeHtml(data.grade)+'</span> <span style="font-size:13px;font-weight:500">'+escapeHtml(data.subj)+'</span> <span style="font-size:12px;color:var(--amber)">( ครู'+escapeHtml(subAbsentTeacher)+' )</span></div></div>';
    if(freeList.length===0){
      h+='<div class="no-free">ครูทุกคนมีคาบใน'+escapeHtml(PERIOD_SHORT[idx])+' ไม่มีครูว่าง</div>';
    } else {
      h+='<div class="sub-label" style="margin-bottom:6px">ครูที่ว่าง '+freeList.length+' คน — กดเลือกเพื่อจัดสอนแทน</div><div class="avail-list">';
      freeList.forEach(function(t){
        var col=avatarCol(t);
        var isPicked=picked===t;
        var dayLoad=TEACHER_DATA[t][subDay].map(function(s,i){return {i:i,s:s};});
        var busyCount=dayLoad.filter(function(x){return x.s;}).length;
        h+='<div class="avail-card'+(isPicked?' picked':'')+'" onclick=\'togglePick('+idx+','+jsArg(t)+')\'>';
        h+='<div class="avail-avatar" style="background:'+col.bg+';color:'+col.fg+'">'+escapeHtml(t[0])+'</div>';
        h+='<div style="flex:1"><div class="avail-name">ครู'+escapeHtml(t)+(isPicked?' ✓':'')+'</div>';
        h+='<div class="avail-stat">สอน '+busyCount+' คาบในวัน'+escapeHtml(subDay)+'</div>';
        h+='<div class="avail-periods">';
        dayLoad.forEach(function(x){
          if(x.i===idx) return;
          h+=x.s?'<span class="pb pb-busy">'+escapeHtml(PERIOD_SHORT[x.i])+': '+escapeHtml(x.s.subj)+'</span>':'<span class="pb pb-free">'+escapeHtml(PERIOD_SHORT[x.i])+': ว่าง</span>';
        });
        h+='</div>';
        h+='</div></div>';
      });
      h+='</div>';
      if(picked){
        var buttonLabel='บันทึก ✓';
        var buttonDisabled='';
        if(savedEntry && savedEntry.substitute===picked){
          buttonLabel='บันทึกแล้ว';
          buttonDisabled=' disabled';
        }else if(savedEntry){
          buttonLabel='อัปเดตการสอนแทน';
        }
        h+='<div class="confirm-bar"><div class="confirm-info">จัด <strong>ครู'+escapeHtml(picked)+'</strong> สอนแทน '+escapeHtml(subDay)+' '+escapeHtml(PERIOD_SHORT[idx])+'<br><span style="opacity:.7;font-size:12px">'+escapeHtml(data.grade)+' — '+escapeHtml(data.subj)+'</span></div><button class="confirm-btn"'+buttonDisabled+' onclick="confirmSub('+idx+')">'+buttonLabel+'</button></div>';
      }
    }
    h+='</div>';
  });
  h+='<div class="sub-section-title">ประวัติการจัดสอนแทน (เซสชันนี้)</div>';
  h+=renderLogHTML();
  bodyEl.innerHTML=h;
}

function sortLogEntries(entries){
  return entries.slice().sort(function(a,b){
    var ad=a.date||('legacy-'+(a.day||'')), bd=b.date||('legacy-'+(b.day||''));
    if(ad!==bd) return ad<bd?1:-1;
    return (a.periodIdx||0)-(b.periodIdx||0);
  });
}

function groupLogEntries(entries){
  var grouped={};
  entries.forEach(function(e){
    var key=e.date?e.date:'legacy-'+(e.day||'unknown');
    if(!grouped[key]){
      grouped[key]={date:e.date||'', day:e.day||'', entries:[]};
    }
    grouped[key].entries.push({entry:e,key:subLogKey(e)});
  });
  return Object.keys(grouped).map(function(key){return {key:key,data:grouped[key]};}).sort(function(a,b){
    if(a.data.date!==b.data.date) return a.data.date<b.data.date?1:-1;
    return a.key<b.key?1:-1;
  });
}

function renderLogHTML(){
  var entries=sortLogEntries(subLog);
  var groups=groupLogEntries(entries);
  var h='<div class="sub-summary" id="sub-summary">';
  h+='<div class="sub-summary-head"><div><div class="sub-summary-title">สรุปการจัดสอนแทน</div><div class="summary-group-sub">เรียงตามวันและเวลาคาบ เพื่อดูงานล่วงหน้าได้ง่าย</div></div><div class="summary-toolbar"><button class="export-btn" onclick="downloadSummaryPng()">บันทึก</button><button class="export-btn" onclick="copySummaryPng()">คัดลอก</button></div></div>';
  if(subLog.length===0){
    h+='<div class="summary-empty">ยังไม่มีการบันทึกการสอนแทน</div></div>';
    return h;
  }
  groups.forEach(function(group){
    var dayLabel=group.data.date?thaiDateLabel(group.data.date):('วัน'+(group.data.day||'ไม่ระบุ'));
    var periodCount=group.data.entries.length;
    h+='<div class="summary-group">';
    h+='<div class="summary-group-head"><div><div class="summary-group-date">'+escapeHtml(dayLabel)+'</div><div class="summary-group-sub">วัน'+escapeHtml(group.data.day||weekdayFromIso(group.data.date))+' · '+periodCount+' รายการ</div></div><div class="summary-badges"><span class="summary-pill primary">'+escapeHtml(periodCount+' คาบ')+'</span></div></div>';
    group.data.entries.forEach(function(pair){
      var e=pair.entry;
      h+='<div class="summary-item"><div><div class="summary-time">'+escapeHtml(e.periodTime||PERIODS[e.periodIdx||0].time||'')+'</div><div class="summary-meta">'+escapeHtml(e.periodLabel||'')+'</div></div><div><div class="summary-main"><strong>'+escapeHtml(e.grade||'')+'</strong> '+escapeHtml(e.subject||e.original||'')+'</div><div class="summary-meta">ครูเดิม '+escapeHtml(e.absentTeacher||'')+' · ครูสอนแทน <strong>ครู'+escapeHtml(e.substitute||'')+'</strong></div></div><div class="summary-grade">'+escapeHtml(e.day||group.data.day||'')+'</div><button class="summary-delete" onclick=\'deleteSubByKey('+jsArg(pair.key)+')\'>ลบ</button></div>';
    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function saveLog(){localStorage.setItem('subLog',JSON.stringify(subLog));}
function togglePick(periodIdx,teacher){
  if(subPickedMap[periodIdx]===teacher) delete subPickedMap[periodIdx];
  else subPickedMap[periodIdx]=teacher;
  renderSubBody();
}
function confirmSub(periodIdx){
  syncSubDateFromInput();
  var data=TEACHER_DATA[subAbsentTeacher][subDay][periodIdx];
  var substitute=subPickedMap[periodIdx];
  if(!data || !substitute) return;
  var record={
    date:subDate,
    day:subDay,
    periodIdx:periodIdx,
    periodLabel:PERIOD_SHORT[periodIdx],
    periodTime:timeLabelForPeriod(periodIdx),
    grade:data.grade,
    subject:data.subj,
    absentTeacher:subAbsentTeacher,
    substitute:substitute,
    original:data.grade+' — '+data.subj+' (ครู'+subAbsentTeacher+')'
  };
  var existingIndex=findSubLogIndex(subDate,subDay,subAbsentTeacher,periodIdx);
  if(existingIndex>=0) subLog.splice(existingIndex,1,record);
  else subLog.unshift(record);
  subPickedMap[periodIdx]=substitute;
  saveLog();
  renderSubBody();
}
function deleteSubByKey(key){
  var idx=subLog.findIndex(function(entry){return subLogKey(entry)===key;});
  if(idx<0) return;
  var removed=subLog[idx];
  subLog.splice(idx,1);
  if(removed.date===subDate && removed.day===subDay && removed.absentTeacher===subAbsentTeacher){
    delete subPickedMap[removed.periodIdx];
  }
  saveLog();
  renderSubBody();
}

function setSubDate(value){
  subDate=value||todayIso();
  subDay=weekdayFromIso(subDate);
  subPickedMap={};
  renderSubBody();
}

async function exportSummaryImage(){
  var summary=document.getElementById('sub-summary');
  if(!summary){
    alert('ยังไม่มีตารางสรุปให้ส่งออก');
    return null;
  }
  if(typeof html2canvas!=='function'){
    alert('เครื่องมือนำออกรูปยังไม่พร้อมใช้งาน');
    return null;
  }
  summary.classList.add('exporting');
  var canvas;
  try{
    canvas=await html2canvas(summary,{backgroundColor:'#ffffff',scale:isCompactDevice()?1.35:2,useCORS:true});
  }finally{
    summary.classList.remove('exporting');
  }
  return new Promise(function(resolve){
    canvas.toBlob(function(blob){
      if(!blob){
        alert('สร้างรูปไม่สำเร็จ');
        resolve(null);
        return;
      }
      resolve(blob);
    },'image/png');
  });
}

async function downloadSummaryPng(){
  var blob=await exportSummaryImage();
  if(!blob) return false;
  var file=createSummaryFile(blob);
  if(isCompactDevice() && canShareFile(file)){
    try{
      await navigator.share({files:[file],title:'ตารางสรุปจัดสอนแทน',text:'ตารางสรุปจัดสอนแทน'});
      return true;
    }catch(e){
      if(e && e.name==='AbortError') return false;
    }
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  return true;
}

async function copyBlobWithClipboardApi(blob){
  if(!navigator.clipboard || typeof ClipboardItem==='undefined') return false;
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    return true;
  }catch(e){}
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':Promise.resolve(blob)})]);
    return true;
  }catch(e){
    return false;
  }
}

async function copyBlobWithSelection(blob){
  if(!document.createRange || !window.getSelection || !document.execCommand) return false;
  var url=URL.createObjectURL(blob);
  var box=document.createElement('div');
  var img=document.createElement('img');
  box.contentEditable='true';
  box.style.position='fixed';
  box.style.left='-9999px';
  box.style.top='0';
  img.src=url;
  box.appendChild(img);
  document.body.appendChild(box);
  try{
    if(img.decode) await img.decode().catch(function(){});
    var range=document.createRange();
    range.selectNodeContents(box);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok=document.execCommand('copy');
    sel.removeAllRanges();
    return !!ok;
  }catch(e){
    return false;
  }finally{
    box.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
}

async function copySummaryPng(){
  var blob=await exportSummaryImage();
  if(!blob) return false;
  if(await copyBlobWithClipboardApi(blob)){
    alert('คัดลอกรูปตารางสรุปแล้ว');
    return true;
  }
  if(await copyBlobWithSelection(blob)){
    alert('คัดลอกรูปตารางสรุปแล้ว');
    return true;
  }
  alert('อุปกรณ์หรือเบราว์เซอร์นี้ยังไม่อนุญาตให้คัดลอกรูปลงคลิปบอร์ดโดยตรง');
  return false;
}

function buildLegend(){
  var base='<div class="legend"><div class="legend-item"><div class="legend-dot" style="background:var(--blue-lt);border:1px solid #b5d4f4"></div>ช่วงเช้า</div><div class="legend-item"><div class="legend-dot" style="background:var(--amber-lt);border:1px solid #f9cb75"></div>พักกลางวัน</div><div class="legend-item"><div class="legend-dot" style="background:var(--org-lt);border:1px solid #f9c28a"></div>ช่วงบ่าย</div>';
  if(mode==='teacher') return base+'<div class="legend-item"><div class="legend-dot" style="background:var(--blue-lt);border:1px solid #b5d4f4"></div>ป.</div><div class="legend-item"><div class="legend-dot" style="background:var(--purp-lt);border:1px solid #c9b8ef"></div>ม.</div></div>';
  return base+'<div class="legend-item"><div class="legend-dot" style="background:var(--purp-lt);border:1px solid #c9b8ef"></div>กิจกรรมพิเศษ</div></div>';
}

function buildFilterBar(){
  var fb=document.getElementById('filter-bar');
  if(mode==='sub'){fb.innerHTML='';fb.style.display='none';return;}
  fb.style.display='flex';
  var items=mode==='day'?DAYS:mode==='grade'?GRADES:ALL_TEACHERS;
  var label=mode==='day'?'วัน :':mode==='grade'?'ชั้น :':'ครู :';
  var h='<span class="filter-label">'+escapeHtml(label)+'</span>';
  items.forEach(function(item){
    h+='<button class="chip'+(item===selected?' active':'')+'" onclick=\'selectItem('+jsArg(item)+')\'>'+escapeHtml(item)+'</button>';
  });
  fb.innerHTML=h;
}

function render(){
  var content;
  if(mode==='day') content=buildDayView();
  else if(mode==='grade') content=buildGradeView();
  else if(mode==='teacher') content=buildTeacherView();
  else content=buildSubView();
  var mc=document.getElementById('main-content');
  mc.innerHTML=(mode==='sub'?'':buildLegend())+content;
  if(mode==='sub') renderSubBody();
  buildFilterBar();
}

function setMode(m){
  mode=m;
  if(m==='day') selected='จันทร์';
  else if(m==='grade') selected='ป.1';
  else if(m==='teacher') selected=ALL_TEACHERS[0];
  else selected='';
  document.querySelectorAll('.mode-tab').forEach(function(el,i){
    el.classList.toggle('active',(i===0&&m==='day')||(i===1&&m==='grade')||(i===2&&m==='teacher')||(i===3&&m==='sub'));
  });
  render();
}

function selectItem(item){selected=item;render();}
render();
</script>
</body>
