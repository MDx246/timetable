<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางสอน 2569 — โรงเรียนดอนสีนวนฯ</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#1a3a6b;--blue:#2e6db4;--blue-lt:#d9e8f7;--blue-md:#4a90d9;
  --purple:#5c3d99;--purp-lt:#eee8f8;--purp-md:#8060bb;
  --amber:#7d5700;--amber-lt:#fff9e6;
  --orange:#7d4000;--org-lt:#ffe8cc;
  --teal:#0f5c52;
  --bg:#f4f6fb;--surface:#fff;--border:#dde3ee;
  --text:#1a2233;--muted:#6b7a99;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--navy);color:#fff;padding:18px 28px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(26,58,107,.22);}
.header-top{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
.school-icon{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.school-name{font-size:15px;font-weight:600;}
.school-sub{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px;}
.app-meta{font-size:10.5px;color:rgba(255,255,255,.56);margin-top:3px;}
.mode-tabs{display:flex;gap:2px;}
.mode-tab{padding:8px 22px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65);border-radius:8px 8px 0 0;transition:all .18s;}
.mode-tab.active{background:var(--bg);color:var(--navy);}
.mode-tab:hover:not(.active){background:rgba(255,255,255,.16);color:#fff;}
.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 28px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:12px;color:var(--muted);font-weight:500;margin-right:2px;white-space:nowrap;}
.chip{padding:5px 13px;border-radius:20px;border:1.5px solid var(--border);background:transparent;font-size:12.5px;font-family:inherit;font-weight:500;color:var(--text);cursor:pointer;transition:all .14s;white-space:nowrap;}
.chip:hover{border-color:var(--blue);color:var(--blue);}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
main{padding:20px 28px;}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.table-wrap{background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow-x:auto;box-shadow:0 2px 8px rgba(26,58,107,.06);}
table{width:100%;border-collapse:collapse;min-width:700px;}
th,td{padding:0;border:1px solid var(--border);text-align:center;vertical-align:middle;}
.th-corner,.th-grade,.th-day{background:var(--navy);color:#fff;font-size:13px;font-weight:600;padding:10px 14px;white-space:nowrap;}
.th-period{font-size:11.5px;font-weight:600;padding:7px 5px;line-height:1.4;}
.th-morning{background:var(--blue-lt);color:var(--navy);}
.th-lunch{background:var(--amber-lt);color:var(--amber);}
.th-afternoon{background:var(--org-lt);color:var(--orange);}
td.grade-label{background:var(--blue-md);color:#fff;font-weight:600;font-size:13px;padding:0 10px;white-space:nowrap;}
td.grade-label.mid{background:var(--purple);}
td.day-label{background:var(--blue);color:#fff;font-weight:600;font-size:13px;padding:8px 12px;white-space:nowrap;}
td.teacher-day-label{background:var(--teal);color:#fff;font-weight:600;font-size:13px;padding:8px 12px;white-space:nowrap;}
.cell-subject{padding:7px 5px;font-size:12px;line-height:1.3;}
tr:nth-child(even) .cell-subject{background:#f7f9fd;}
.cell-subject .subj{font-weight:600;font-size:12px;display:block;}
.cell-subject .meta{font-size:10.5px;color:var(--muted);display:block;margin-top:2px;}
.cell-subject.special{background:var(--purp-lt)!important;}
.cell-subject.special .subj{color:var(--purple);}
.cell-subject.special .meta{color:var(--purp-md);}
.cell-lunch{background:var(--amber-lt);color:var(--amber);font-size:11px;font-weight:500;padding:7px 4px;font-style:italic;}
.cell-free{background:#f9fafc;color:#c0c8d8;font-size:11px;padding:7px 4px;}
.teacher-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:120px;text-align:center;}
.stat-num{font-size:22px;font-weight:600;color:var(--navy);}
.stat-label{font-size:11.5px;color:var(--muted);margin-top:2px;}
.sub-top{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.sub-label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;}
.sub-select{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);cursor:pointer;}
.sub-select:focus{outline:none;border-color:var(--blue);}
.sub-date-wrap{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;}
.sub-date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sub-date{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);}
.sub-date:focus{outline:none;border-color:var(--blue);}
.sub-date-weekday{font-size:12px;color:var(--muted);margin-top:6px;}
.sub-summary{margin-top:18px;}
.sub-summary-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;}
.sub-summary-title{font-size:13px;font-weight:600;color:var(--navy);}
.summary-toolbar{display:flex;gap:8px;flex-wrap:wrap;}
.export-btn{border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.export-btn:hover{border-color:var(--blue);color:var(--blue);}
.export-btn:disabled{opacity:.5;cursor:not-allowed;}
.report-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(26,58,107,.05);}
.report-title{font-size:13px;font-weight:600;color:var(--navy);}
.report-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.report-actions{display:flex;gap:8px;flex-wrap:wrap;}
.summary-group{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(26,58,107,.04);}
.summary-group-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px;}
.summary-group-date{font-size:14px;font-weight:600;color:var(--text);}
.summary-group-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.summary-badges{display:flex;gap:6px;flex-wrap:wrap;}
.summary-pill{font-size:11px;padding:3px 8px;border-radius:999px;background:#f3f4f6;color:var(--muted);}
.summary-pill.primary{background:var(--blue-lt);color:var(--navy);}
.summary-item{display:grid;grid-template-columns:110px 1fr auto auto;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--border);}
.summary-item:first-of-type{border-top:none;padding-top:0;}
.summary-time{font-size:12px;font-weight:600;color:var(--navy);}
.summary-main{font-size:13px;color:var(--text);line-height:1.45;}
.summary-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.summary-grade{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--purp-lt);color:var(--purple);white-space:nowrap;}
.summary-delete{background:none;border:1px solid #fecaca;color:#dc2626;border-radius:7px;padding:4px 8px;font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap;}
.summary-delete:hover{background:#fee2e2;}
.exporting .summary-delete{display:none!important;}
.exporting .summary-item{grid-template-columns:110px 1fr auto;}
.summary-empty{background:#f9fafc;border:1px dashed var(--border);border-radius:12px;padding:16px;color:var(--muted);font-size:13px;text-align:center;}
.sub-section-title{font-size:12px;font-weight:500;color:var(--muted);margin:18px 0 8px;letter-spacing:.5px;}
.sub-original{background:#fff8e1;border:1px solid #f9c94e;border-radius:10px;padding:12px 16px;margin-bottom:10px;}
.sub-original-hdr{font-size:12px;font-weight:600;color:#7d5700;margin-bottom:6px;}
.sub-orig-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);padding:3px 0;flex-wrap:wrap;}
.sub-orig-badge{background:var(--navy);color:#fff;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:500;}
.avail-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.avail-card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .15s,background .15s;}
.avail-card:hover{border-color:var(--blue);}
.avail-card.picked{border-color:var(--blue);background:#f0f5ff;}
.avail-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0;}
.avail-name{font-size:13px;font-weight:600;color:var(--text);}
.avail-stat{font-size:11.5px;color:var(--muted);margin-top:1px;}
.avail-periods{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.pb{font-size:10.5px;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.pb-busy{background:#fee2e2;color:#991b1b;}
.pb-free{background:#dcfce7;color:#166534;}
.no-free{background:#f3f4f6;color:var(--muted);border-radius:10px;padding:14px 16px;font-size:13px;text-align:center;margin-bottom:10px;}
.confirm-bar{background:var(--navy);color:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;margin-bottom:6px;}
.confirm-info{font-size:13px;line-height:1.5;}
.confirm-btn{background:#fff;color:var(--navy);border:none;border-radius:7px;padding:7px 16px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
.confirm-btn:hover{background:#e8f0fb;}
.confirm-btn:disabled{background:#dbe6f5;color:#5c6f8f;cursor:default;}
.sub-period-block{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);}
.sub-period-block:last-of-type{border-bottom:none;}
.log-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.log-table th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;font-weight:500;}
.log-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
.log-table tr:last-child td{border-bottom:none;}
.log-empty{color:var(--muted);font-size:13px;text-align:center;padding:14px;}
.del-btn{background:none;border:none;color:#dc2626;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px;}
.del-btn:hover{background:#fee2e2;}
.copy-preview{position:fixed;inset:0;background:rgba(10,18,32,.72);z-index:999;display:flex;align-items:center;justify-content:center;padding:18px;}
.copy-preview-card{background:#fff;color:var(--text);border-radius:14px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.28);}
.copy-preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
.copy-preview-title{font-size:14px;font-weight:600;color:var(--navy);}
.copy-preview-close{border:none;background:#f3f4f6;color:var(--text);border-radius:8px;padding:6px 10px;font-family:inherit;font-size:12px;cursor:pointer;}
.copy-preview-img{display:block;width:100%;border:1px solid var(--border);border-radius:10px;}
.copy-preview-note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px;}
.manage-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(26,58,107,.05);}
.manage-grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
.manage-field label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:5px;}
.manage-input,.manage-select,.manage-textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font-family:inherit;font-size:13px;padding:8px 10px;}
.manage-input:focus,.manage-select:focus,.manage-textarea:focus{outline:none;border-color:var(--blue);}
.manage-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.manage-btn{border:1.5px solid var(--border);background:#fff;color:var(--text);border-radius:8px;padding:8px 13px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
.manage-btn:hover{border-color:var(--blue);color:var(--blue);}
.manage-btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.manage-btn.danger{border-color:#fecaca;color:#dc2626;}
.manage-btn.danger:hover{background:#fee2e2;color:#b91c1c;}
.manage-current{font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px;}
.manage-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:700px;}
.manage-table th{background:var(--navy);color:#fff;text-align:left;padding:8px 10px;font-weight:500;}
.manage-table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;}
.manage-table tr:last-child td{border-bottom:none;}
.manage-row-actions{display:flex;gap:6px;flex-wrap:wrap;}
.manage-mini{border:1px solid var(--border);background:#fff;border-radius:7px;padding:4px 8px;font-size:11.5px;font-family:inherit;cursor:pointer;}
.manage-mini:hover{border-color:var(--blue);color:var(--blue);}
.manage-mini.danger{border-color:#fecaca;color:#dc2626;}
.import-box{margin-top:12px;}
.manage-textarea{min-height:150px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;}
.manage-note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;}
@media(max-width:600px){
  header{padding:14px 16px 0;}
  main{padding:14px 16px;}
  .filter-bar{padding:10px 16px;}
  .sub-top{grid-template-columns:1fr;}
  .avail-card{padding:10px 12px;gap:10px;}
  .avail-avatar{width:32px;height:32px;font-size:14px;}
  .avail-periods{gap:3px;margin-top:5px;}
  .pb{font-size:9.5px;padding:2px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .summary-item{grid-template-columns:88px 1fr auto;}
  .summary-grade{display:none;}
  .summary-delete{grid-column:3;grid-row:1 / span 2;align-self:center;}
  .report-toolbar{align-items:stretch;}
  .report-actions{width:100%;}
  .report-actions .export-btn{flex:1;}
  .manage-grid{grid-template-columns:1fr;}
  .manage-actions{align-items:stretch;}
  .manage-btn{flex:1;}
}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="school-icon">🏫</div>
    <div>
      <div class="school-name">โรงเรียนดอนสีนวนฯ</div>
      <div class="school-sub">ตารางสอน ปีการศึกษา 2569 ภาคเรียนที่ 1</div>
      <div class="app-meta">Version 1.6.0 · จัดทำโดย modsomphop</div>
    </div>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" onclick="setMode('day')">รายวัน</button>
    <button class="mode-tab" onclick="setMode('grade')">รายชั้น</button>
    <button class="mode-tab" onclick="setMode('teacher')">รายครู</button>
    <button class="mode-tab" onclick="setMode('sub')">จัดสอนแทน</button>
    <button class="mode-tab" onclick="setMode('manage')">จัดการข้อมูล</button>
  </div>
</header>
<div class="filter-bar" id="filter-bar"></div>
<main id="main-content"></main>

<script>
const APP_VERSION="1.6.0";
const APP_AUTHOR="modsomphop";
const DAYS=["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์"];
const GRADES=["ป.1","ป.2","ป.3","ป.4","ป.5","ป.6","ม.1","ม.2","ม.3"];
const PERIODS=[
  {label:"คาบ 1",time:"08.30–09.30",type:"morning"},
  {label:"คาบ 2",time:"09.30–10.30",type:"morning"},
  {label:"คาบ 3",time:"10.30–11.30",type:"morning"},
  {label:"พักกลางวัน",time:"11.30–12.30",type:"lunch"},
  {label:"คาบ 4",time:"12.30–13.30",type:"afternoon"},
  {label:"คาบ 5",time:"13.30–14.30",type:"afternoon"},
  {label:"คาบ 6",time:"14.30–15.30",type:"afternoon"},
];
const TEACHING_PERIODS=[PERIODS[0],PERIODS[1],PERIODS[2],PERIODS[4],PERIODS[5],PERIODS[6]];
const PERIOD_SHORT=["คาบ 1","คาบ 2","คาบ 3","คาบ 4","คาบ 5","คาบ 6"];
const SPECIAL=new Set(["ชุมนุม","ลูกเสือ","อบรมสุดสัปดาห์","ลดเวลาเรียน"]);

function cloneScheduleData(data){
  return JSON.parse(JSON.stringify(data));
}

function normalizeScheduleData(data){
  var base=cloneScheduleData(DEFAULT_DATA);
  if(!data || typeof data!=='object') return base;
  DAYS.forEach(function(day){
    if(!data[day] || typeof data[day]!=='object') return;
    GRADES.forEach(function(grade){
      if(!Array.isArray(data[day][grade])) return;
      base[day][grade]=[0,1,2,3,4,5].map(function(i){
        return typeof data[day][grade][i]==='string'?data[day][grade][i]:'';
      });
    });
  });
  return base;
}

function loadScheduleData(){
  try{
    var raw=localStorage.getItem('scheduleData');
    return raw?normalizeScheduleData(JSON.parse(raw)):cloneScheduleData(DEFAULT_DATA);
  }catch(e){
    return cloneScheduleData(DEFAULT_DATA);
  }
}

function saveScheduleData(){
  localStorage.setItem('scheduleData',JSON.stringify(DATA));
}

let DATA=loadScheduleData();

function parse(raw){
  var parts=String(raw).split('|');
  return {subj:parts[0]||'',teacher:parts[1]?parts[1].replace(/[()]/g,''):''};
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g,function(ch){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]);
  });
}

function jsArg(value){
  return JSON.stringify(String(value));
}

function createTeacherData(){
  var teachers={};
  DAYS.forEach(function(day){
    GRADES.forEach(function(grade){
      (DATA[day][grade]||[]).forEach(function(raw,periodIdx){
        if(!raw) return;
        var parsed=parse(raw);
        if(!parsed.teacher) return;
        if(!teachers[parsed.teacher]){
          teachers[parsed.teacher]={};
          DAYS.forEach(function(d){
            teachers[parsed.teacher][d]=[null,null,null,null,null,null];
          });
        }
        teachers[parsed.teacher][day][periodIdx]={subj:parsed.subj,grade:grade};
      });
    });
  });

  Object.keys(teachers).forEach(function(t){
    teachers[t]["พุธ"][5]={subj:"ชุมนุม",grade:"ทุกชั้น"};
    teachers[t]["พฤหัสบดี"][5]={subj:"ลูกเสือ",grade:"ทุกชั้น"};
    teachers[t]["ศุกร์"][5]={subj:"อบรมสุดสัปดาห์",grade:"ทุกชั้น"};
  });

  return teachers;
}

let TEACHER_DATA=createTeacherData();
let ALL_TEACHERS=Object.keys(TEACHER_DATA).sort();

let mode='day', selected='จันทร์';

function refreshDerivedData(){
  TEACHER_DATA=createTeacherData();
  ALL_TEACHERS=Object.keys(TEACHER_DATA).sort();
  if(mode==='teacher' && !TEACHER_DATA[selected]){
    selected=ALL_TEACHERS[0]||'';
  }
  if(mode==='sub' && !TEACHER_DATA[subAbsentTeacher]){
    subAbsentTeacher=ALL_TEACHERS[0]||'';
    subPickedMap={};
  }
}

function isSpecial(s){return SPECIAL.has(s);}

function periodHeaderRow(){
  return PERIODS.map(function(p){
    return '<th class="th-period th-'+p.type+'">'+escapeHtml(p.label)+'<br><small>'+escapeHtml(p.time)+'</small></th>';
  }).join('');
}

function subjectCell(raw,even){
  if(!raw) return '<td class="cell-subject" style="background:'+(even?'#f7f9fd':'#fff')+'"></td>';
  var p=parse(raw);
  var sp=isSpecial(p.subj)?'special':'';
  var bg=sp?'':(even?'background:#f7f9fd':'background:#fff');
  return '<td class="cell-subject '+sp+'" style="'+bg+'"><span class="subj">'+escapeHtml(p.subj)+'</span>'+(p.teacher?'<span class="meta">'+escapeHtml(p.teacher)+'</span>':'')+'</td>';
}

function reportTitleForCurrentView(){
  if(mode==='day') return 'ตารางสอนรายวัน: วัน'+selected;
  if(mode==='grade') return 'ตารางสอนรายชั้น: '+selected;
  if(mode==='teacher') return 'ตารางสอนรายครู: ครู'+selected;
  return 'ตารางสอน';
}

function reportSubForCurrentView(){
  return 'โรงเรียนดอนสีนวนฯ · ปีการศึกษา 2569 ภาคเรียนที่ 1 · Version '+APP_VERSION;
}

function buildReportToolbar(){
  return '<div class="report-toolbar"><div><div class="report-title">'+escapeHtml(reportTitleForCurrentView())+'</div><div class="report-sub">'+escapeHtml(reportSubForCurrentView())+'</div></div><div class="report-actions"><button class="export-btn" onclick="printCurrentReport()">พิมพ์</button><button class="export-btn" onclick="saveCurrentReportPdf()">บันทึก PDF</button></div></div>';
}

function buildDayViewFor(day){
  var h='<div class="table-wrap"><table><thead><tr><th class="th-corner">ชั้น</th>'+periodHeaderRow()+'</tr></thead><tbody>';
  GRADES.forEach(function(g,i){
    var mid=g.startsWith('ม');
    var even=i%2===1;
    h+='<tr><td class="grade-label'+(mid?' mid':'')+'">'+escapeHtml(g)+'</td>';
    var s=DATA[day][g];
    h+=subjectCell(s[0],even)+subjectCell(s[1],even)+subjectCell(s[2],even);
    h+='<td class="cell-lunch">🍽<br>พัก</td>';
    h+=subjectCell(s[3],even)+subjectCell(s[4],even)+subjectCell(s[5],even);
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

function buildDayView(){
  return buildDayViewFor(selected);
}

function buildGradeView(){
  var h='<div class="table-wrap"><table><thead><tr><th class="th-corner">วัน</th>'+periodHeaderRow()+'</tr></thead><tbody>';
  DAYS.forEach(function(d,i){
    var even=i%2===1;
    h+='<tr><td class="day-label">'+escapeHtml(d)+'</td>';
    var s=DATA[d][selected];
    h+=subjectCell(s[0],even)+subjectCell(s[1],even)+subjectCell(s[2],even);
    h+='<td class="cell-lunch">🍽<br>พัก</td>';
    h+=subjectCell(s[3],even)+subjectCell(s[4],even)+subjectCell(s[5],even);
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

  }catch(e){
    return [];
  }
}

function getAbsentPeriods(teacher,day){
  return TEACHER_DATA[teacher][day].map(function(s,i){return {idx:i,data:s};}).filter(function(x){return x.data;});
}
function getFreeTeachers(day,periodIdx,exclude){
  return ALL_TEACHERS.filter(function(t){
    if(t===exclude) return false;
    return !TEACHER_DATA[t][day][periodIdx];
  });
}
function avatarCol(name){
  var c=[{bg:'#dbeafe',fg:'#1e40af'},{bg:'#dcfce7',fg:'#166534'},{bg:'#fce7f3',fg:'#9d174d'},{bg:'#fef3c7',fg:'#92400e'},{bg:'#ede9fe',fg:'#5b21b6'},{bg:'#fee2e2',fg:'#991b1b'},{bg:'#e0f2fe',fg:'#075985'},{bg:'#d1fae5',fg:'#065f46'},{bg:'#fef9c3',fg:'#713f12'},{bg:'#f3e8ff',fg:'#6b21a8'}];

function todayIso(){
  var d=new Date();
  var y=d.getFullYear();
  var m=String(d.getMonth()+1).padStart(2,'0');
  var day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function weekdayFromIso(iso){
  if(!iso) return 'จันทร์';
  var d=new Date(iso+'T12:00:00');
  var map=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  return map[d.getDay()]||'จันทร์';
}

function thaiDateLabel(iso){
  if(!iso) return 'ไม่ระบุวันที่';
  try{
    return new Intl.DateTimeFormat('th-TH-u-ca-buddhist', {dateStyle:'full'}).format(new Date(iso+'T12:00:00'));
  }catch(e){
    return iso;
  }
}

function timeLabelForPeriod(periodIdx){
  return TEACHING_PERIODS[periodIdx]?TEACHING_PERIODS[periodIdx].time:'';
}

function subLogKey(entry){
  return [
    entry.date||'',
    entry.day||'',
    entry.absentTeacher||'',
    Number(entry.periodIdx),
    entry.grade||'',
    entry.subject||''
  ].join('|');
}

function isCompactDevice(){
  return typeof window!=='undefined' && window.matchMedia && window.matchMedia('(max-width: 600px)').matches;
}

function canShareFile(file){
  try{
    return !!(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]})));
  }catch(e){
    return false;
  }
}

function sortLogEntries(entries){
  return entries.slice().sort(function(a,b){
    var ad=a.date||('legacy-'+(a.day||'')), bd=b.date||('legacy-'+(b.day||''));
    if(ad!==bd) return ad<bd?1:-1;
    return (a.periodIdx||0)-(b.periodIdx||0);
  });
}

function groupLogEntries(entries){
  var grouped={};
  entries.forEach(function(e){
    var key=e.date?e.date:'legacy-'+(e.day||'unknown');
    if(!grouped[key]){
      grouped[key]={date:e.date||'', day:e.day||'', entries:[]};
    }
    grouped[key].entries.push({entry:e,key:subLogKey(e)});
  });
  return Object.keys(grouped).map(function(key){return {key:key,data:grouped[key]};}).sort(function(a,b){
    if(a.data.date!==b.data.date) return a.data.date<b.data.date?1:-1;
    return a.key<b.key?1:-1;
  });
}

function renderLogHTML(){
  var entries=sortLogEntries(subLog);
  var groups=groupLogEntries(entries);
  var h='<div class="sub-summary" id="sub-summary">';
  h+='<div class="sub-summary-head"><div><div class="sub-summary-title">สรุปการจัดสอนแทน</div><div class="summary-group-sub">เรียงตามวันและเวลาคาบ เพื่อดูงานล่วงหน้าได้ง่าย</div></div><div class="summary-toolbar"><button class="export-btn" onclick="downloadSummaryPng()">บันทึก</button><button class="export-btn" onclick="copySummaryPng()">คัดลอก</button></div></div>';
  if(subLog.length===0){
    h+='<div class="summary-empty">ยังไม่มีการบันทึกการสอนแทน</div></div>';
    return h;
  }
  groups.forEach(function(group){
    var dayLabel=group.data.date?thaiDateLabel(group.data.date):('วัน'+(group.data.day||'ไม่ระบุ'));
    var periodCount=group.data.entries.length;

    group.data.entries.forEach(function(pair){

    });
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function saveLog(){localStorage.setItem('subLog',JSON.stringify(subLog));}
function togglePick(periodIdx,teacher){
  if(subPickedMap[periodIdx]===teacher) delete subPickedMap[periodIdx];
  else subPickedMap[periodIdx]=teacher;
  renderSubBody();
}
function confirmSub(periodIdx){
  syncSubDateFromInput();
  var data=TEACHER_DATA[subAbsentTeacher][subDay][periodIdx];
  var substitute=subPickedMap[periodIdx];
  if(!data || !substitute) return;
  var record={
    date:subDate,
    day:subDay,
    periodIdx:periodIdx,
    periodLabel:PERIOD_SHORT[periodIdx],
    periodTime:timeLabelForPeriod(periodIdx),
    grade:data.grade,
    subject:data.subj,
    absentTeacher:subAbsentTeacher,
    substitute:substitute,
    original:data.grade+' — '+data.subj+' (ครู'+subAbsentTeacher+')'
  };
  var existingIndex=findSubLogIndex(subDate,subDay,subAbsentTeacher,periodIdx);
  if(existingIndex>=0) subLog.splice(existingIndex,1,record);
  else subLog.unshift(record);
  subPickedMap[periodIdx]=substitute;
  saveLog();
  renderSubBody();
}
function deleteSubByKey(key){
  var idx=subLog.findIndex(function(entry){return subLogKey(entry)===key;});
  if(idx<0) return;
  var removed=subLog[idx];
  subLog.splice(idx,1);
  if(removed.date===subDate && removed.day===subDay && removed.absentTeacher===subAbsentTeacher){
    delete subPickedMap[removed.periodIdx];
  }
  saveLog();
  renderSubBody();
}

function setSubDate(value){
  subDate=value||todayIso();
  subDay=weekdayFromIso(subDate);
  subPickedMap={};
  renderSubBody();
}

async function exportSummaryImage(){
  var summary=document.getElementById('sub-summary');
  if(!summary){
    alert('ยังไม่มีตารางสรุปให้ส่งออก');
    return null;
  }
  if(typeof html2canvas!=='function'){
    alert('เครื่องมือนำออกรูปยังไม่พร้อมใช้งาน');
    return null;
  }
  summary.classList.add('exporting');
  var canvas;
  try{
    canvas=await html2canvas(summary,{backgroundColor:'#ffffff',scale:isCompactDevice()?1.35:2,useCORS:true});
  }finally{
    summary.classList.remove('exporting');
  }
  return new Promise(function(resolve){
    canvas.toBlob(function(blob){
      if(!blob){
        alert('สร้างรูปไม่สำเร็จ');
        resolve(null);
        return;
      }
      resolve(blob);
    },'image/png');
  });
}

async function downloadSummaryPng(){
  var blob=await exportSummaryImage();
  if(!blob) return false;
  var file=createSummaryFile(blob);
  if(isCompactDevice() && canShareFile(file)){
    try{
      await navigator.share({files:[file],title:'ตารางสรุปจัดสอนแทน',text:'ตารางสรุปจัดสอนแทน'});
      return true;
    }catch(e){
      if(e && e.name==='AbortError') return false;
    }
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download=file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  return true;
}

async function copyBlobWithClipboardApi(blob){
  if(!navigator.clipboard || typeof ClipboardItem==='undefined') return false;
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    return true;
  }catch(e){}
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':Promise.resolve(blob)})]);
    return true;
  }catch(e){
    return false;
  }
}

function blobToDataUrl(blob){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){resolve(reader.result);};
    reader.onerror=function(){reject(reader.error);};
    reader.readAsDataURL(blob);
  });
}

async function copyBlobWithHtml(blob){
  if(!navigator.clipboard || typeof ClipboardItem==='undefined') return false;
  try{
    var dataUrl=await blobToDataUrl(blob);
    var html='<img src="'+dataUrl+'" alt="ตารางสรุปจัดสอนแทน">';
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob(['ตารางสรุปจัดสอนแทน'],{type:'text/plain'})
      })
    ]);
    return true;
  }catch(e){
    return false;
  }
}

async function copyBlobWithSelection(blob){
  if(!document.createRange || !window.getSelection || !document.execCommand) return false;
  var url=URL.createObjectURL(blob);
  var box=document.createElement('div');
  var img=document.createElement('img');
  box.contentEditable='true';
  box.style.position='fixed';
  box.style.left='-9999px';
  box.style.top='0';
  img.src=url;
  box.appendChild(img);
  document.body.appendChild(box);
  try{
    if(img.decode) await img.decode().catch(function(){});
    var range=document.createRange();
    range.selectNodeContents(box);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok=document.execCommand('copy');
    sel.removeAllRanges();
    return !!ok;
  }catch(e){
    return false;
  }finally{
    box.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
}

async function showCopyPreview(blob){
  var dataUrl=await blobToDataUrl(blob).catch(function(){return '';});
  if(!dataUrl) return;
  var old=document.getElementById('copy-preview');
  if(old) old.remove();
  var wrap=document.createElement('div');
  wrap.id='copy-preview';
  wrap.className='copy-preview';
  wrap.innerHTML='<div class="copy-preview-card"><div class="copy-preview-head"><div class="copy-preview-title">คัดลอกรูปด้วยการแตะค้าง</div><button class="copy-preview-close" onclick="closeCopyPreview()">ปิด</button></div><img class="copy-preview-img" src="'+dataUrl+'" alt="ตารางสรุปจัดสอนแทน"><div class="copy-preview-note">ถ้าเบราว์เซอร์ไม่อนุญาตให้คัดลอกอัตโนมัติ ให้แตะค้างที่รูป แล้วเลือก คัดลอกภาพ หรือ บันทึกรูปภาพ</div></div>';
  document.body.appendChild(wrap);
}

function closeCopyPreview(){
  var el=document.getElementById('copy-preview');
  if(el) el.remove();
}

async function copySummaryPng(){
  var blob=await exportSummaryImage();
  if(!blob) return false;
  if(await copyBlobWithClipboardApi(blob)){
    alert('คัดลอกรูปตารางสรุปแล้ว');
    return true;
  }
  if(await copyBlobWithHtml(blob)){
    alert('คัดลอกรูปตารางสรุปแล้ว');
    return true;
  }
  if(await copyBlobWithSelection(blob)){
    alert('คัดลอกรูปตารางสรุปแล้ว');
    return true;
  }
  await showCopyPreview(blob);
  alert('เบราว์เซอร์นี้ไม่อนุญาตให้คัดลอกอัตโนมัติ ให้แตะค้างที่รูปเพื่อคัดลอก');
  return false;
}

function blankScheduleData(){
  var blank={};
  DAYS.forEach(function(day){
    blank[day]={};
    GRADES.forEach(function(grade){
      blank[day][grade]=['','','','','',''];
    });
  });
  return blank;
}

function scheduleRows(includeLunch){
  var rows=[];
  DAYS.forEach(function(day){
    GRADES.forEach(function(grade){
      [0,1,2].forEach(function(idx){
        var parsed=parse(DATA[day][grade][idx]||'');
        rows.push({'วัน':day,'ชั้น':grade,'คาบ':PERIOD_SHORT[idx],'เวลา':timeLabelForPeriod(idx),'วิชา/กิจกรรม':parsed.subj,'ครู':parsed.teacher,'ประเภท':'สอน'});
      });
      if(includeLunch){
        rows.push({'วัน':day,'ชั้น':grade,'คาบ':'พักกลางวัน','เวลา':'11.30–12.30','วิชา/กิจกรรม':'พักกลางวัน','ครู':'','ประเภท':'พัก'});
      }
      [3,4,5].forEach(function(idx){
        var parsed=parse(DATA[day][grade][idx]||'');
        rows.push({'วัน':day,'ชั้น':grade,'คาบ':PERIOD_SHORT[idx],'เวลา':timeLabelForPeriod(idx),'วิชา/กิจกรรม':parsed.subj,'ครู':parsed.teacher,'ประเภท':'สอน'});
      });
    });
  });
  return rows;
}

function parsePeriodIndex(value){
  var text=String(value||'').trim();
  if(!text || /พัก/.test(text)) return null;
  var match=text.match(/[1-6]/);
  if(!match) return null;
  return Number(match[0])-1;
}

function rowValue(row,names){
  for(var i=0;i<names.length;i++){
    if(Object.prototype.hasOwnProperty.call(row,names[i])) return row[names[i]];
  }
  return '';
}

function applyImportedScheduleRows(rows){
  var next=blankScheduleData();
  var count=0;
  rows.forEach(function(row){
    var day=String(rowValue(row,['วัน','day','Day'])).trim();
    var grade=String(rowValue(row,['ชั้น','grade','Grade'])).trim();
    var periodIdx=parsePeriodIndex(rowValue(row,['คาบ','period','Period']));
    if(DAYS.indexOf(day)<0 || GRADES.indexOf(grade)<0 || periodIdx===null) return;
    var subject=String(rowValue(row,['วิชา/กิจกรรม','วิชา','subject','Subject'])).trim();
    var teacher=String(rowValue(row,['ครู','teacher','Teacher'])).replace(/^ครู/,'').trim();
    next[day][grade][periodIdx]=rawSubject(subject,teacher);
    count++;
  });
  if(count===0){
    alert('นำเข้าไม่สำเร็จ: ไม่พบแถวที่มี วัน, ชั้น, คาบ, วิชา/กิจกรรม');
    return false;
  }
  DATA=normalizeScheduleData(next);
  applyScheduleChange();
  render();
  alert('นำเข้า Excel แล้ว '+count+' แถว');
  return true;
}

function exportScheduleExcel(){
  if(typeof XLSX==='undefined'){
    alert('เครื่องมือ Excel ยังไม่พร้อมใช้งาน กรุณาต่ออินเทอร์เน็ตแล้วโหลดหน้าใหม่');
    return;
  }
  var rows=scheduleRows(true);
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.json_to_sheet(rows,{header:['วัน','ชั้น','คาบ','เวลา','วิชา/กิจกรรม','ครู','ประเภท']});
  ws['!cols']=[{wch:14},{wch:8},{wch:12},{wch:16},{wch:24},{wch:16},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,'ตารางรวม');
  XLSX.writeFile(wb,'ตารางสอนรวม-โรงเรียนดอนสีนวน-'+todayIso()+'.xlsx');
}

function importScheduleExcelFile(input){
  var file=input.files && input.files[0];
  if(!file) return;
  if(typeof XLSX==='undefined'){
    alert('เครื่องมือ Excel ยังไม่พร้อมใช้งาน กรุณาต่ออินเทอร์เน็ตแล้วโหลดหน้าใหม่');
    input.value='';
    return;
  }
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var sheet=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(sheet,{defval:''});
      applyImportedScheduleRows(rows);
    }catch(err){
      alert('นำเข้าไม่สำเร็จ: อ่านไฟล์ Excel ไม่ได้');
    }
    input.value='';
  };
  reader.readAsArrayBuffer(file);
}

function openScheduleExcelImportFile(){
  var input=document.getElementById('schedule-excel-file');
  if(input) input.click();
}

function rawSubject(subject,teacher){
  subject=String(subject||'').trim();
  teacher=String(teacher||'').trim();
  if(!subject) return '';
  return teacher?subject+'|('+teacher+')':subject;
}

function currentManageRaw(){
  return (DATA[manageDay] && DATA[manageDay][manageGrade])?DATA[manageDay][manageGrade][managePeriodIdx]||'':'';
}

function syncManageInputsFromData(){
  var raw=currentManageRaw();
  var parsed=raw?parse(raw):{subj:'',teacher:''};
  var subjEl=document.getElementById('manage-subject');
  var teacherEl=document.getElementById('manage-teacher');
  if(subjEl) subjEl.value=parsed.subj;
  if(teacherEl) teacherEl.value=parsed.teacher;
}

  h+='<div class="manage-field"><label>เวลา</label><input class="manage-input" value="'+escapeHtml(timeLabelForPeriod(managePeriodIdx))+'" disabled></div>';
  h+='</div>';
  h+='<div class="manage-grid">';
  h+='<div class="manage-field"><label>วิชา/กิจกรรม</label><input class="manage-input" id="manage-subject" value="'+escapeHtml(parsed.subj)+'" placeholder="เช่น วิทย์เทคโน"></div>';
  h+='<div class="manage-field"><label>ครูผู้สอน</label><input class="manage-input" id="manage-teacher" value="'+escapeHtml(parsed.teacher)+'" placeholder="เช่น สมภพ"></div>';
  h+='<div class="manage-field"><label>ข้อมูลเดิม</label><input class="manage-input" value="'+escapeHtml(raw||'ว่าง')+'" disabled></div>';
  h+='<div class="manage-field"><label>รูปแบบ</label><input class="manage-input" value="วิชา + ชื่อครู" disabled></div>';
  h+='</div>';
  h+='<div class="manage-actions"><button class="manage-btn primary" onclick="saveManagedPeriod()">บันทึกคาบนี้</button><button class="manage-btn danger" onclick="deleteManagedPeriod()">ลบคาบนี้</button><button class="manage-btn" onclick="exportScheduleExcel()">ส่งออก Excel</button><button class="manage-btn" onclick="openScheduleExcelImportFile()">นำเข้า Excel</button><button class="manage-btn" onclick="printFullSchedule()">พิมพ์ตารางรวม</button><button class="manage-btn" onclick="saveFullSchedulePdf()">บันทึก PDF ตารางรวม</button><button class="manage-btn" onclick="exportScheduleData()">ส่งออก JSON สำรอง</button><button class="manage-btn" onclick="openScheduleImportFile()">นำเข้า JSON</button><button class="manage-btn danger" onclick="resetScheduleData()">คืนค่าเริ่มต้น</button></div>';
  h+='<div class="manage-current">แก้ไขแล้วจะบันทึกในเครื่องนี้ทันที และเมนูรายวัน/รายชั้น/รายครู/จัดสอนแทนจะอัปเดตจากข้อมูลชุดเดียวกัน</div>';
  h+='<input id="schedule-import-file" type="file" accept="application/json,.json" style="display:none" onchange="importScheduleFile(this)">';
  h+='<input id="schedule-excel-file" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" style="display:none" onchange="importScheduleExcelFile(this)">';
  h+='</div>';
  h+='<div id="manage-body"></div>';
  h+='<div class="manage-panel import-box"><div class="sub-summary-title">นำเข้าจากข้อความ JSON</div><textarea class="manage-textarea" id="schedule-import-text" placeholder="วาง JSON ที่ส่งออกจากระบบนี้"></textarea><div class="manage-actions" style="margin-top:8px"><button class="manage-btn primary" onclick="importScheduleText()">นำเข้าข้อมูล</button><button class="manage-btn" onclick="fillExportText()">แสดง JSON ปัจจุบัน</button></div><div class="manage-note">แนะนำให้ใช้ Excel สำหรับแก้ตารางรวม ส่วน JSON ใช้เป็นไฟล์สำรอง การนำเข้าทั้ง Excel และ JSON จะเขียนทับตารางสอนทั้งหมดในเครื่องนี้</div></div>';
  return h;

function renderManageBody(){
  var body=document.getElementById('manage-body');
  if(!body) return;
  var rows=(DATA[manageDay] && DATA[manageDay][manageGrade])?DATA[manageDay][manageGrade]:[];
  var h='<div class="table-wrap"><table class="manage-table"><thead><tr><th>คาบ</th><th>เวลา</th><th>วิชา/กิจกรรม</th><th>ครู</th><th>จัดการ</th></tr></thead><tbody>';
  PERIOD_SHORT.forEach(function(label,i){
    var raw=rows[i]||'';
    var parsed=raw?parse(raw):{subj:'ว่าง',teacher:'-'};
    h+='<tr><td>'+escapeHtml(label)+'</td><td>'+escapeHtml(timeLabelForPeriod(i))+'</td><td>'+escapeHtml(parsed.subj||'ว่าง')+'</td><td>'+escapeHtml(parsed.teacher||'-')+'</td><td><div class="manage-row-actions"><button class="manage-mini" onclick="editManagedPeriod('+i+')">แก้ไข</button><button class="manage-mini danger" onclick="deleteManagedPeriodAt('+i+')">ลบ</button></div></td></tr>';
  });
  h+='</tbody></table></div>';
  body.innerHTML=h;
}

function applyScheduleChange(){
  saveScheduleData();
  refreshDerivedData();
  subPickedMap={};
}

function saveManagedPeriod(){
  var subj=document.getElementById('manage-subject').value;
  var teacher=document.getElementById('manage-teacher').value;
  DATA[manageDay][manageGrade][managePeriodIdx]=rawSubject(subj,teacher);
  applyScheduleChange();
  renderManageBody();
  syncManageInputsFromData();
}

function deleteManagedPeriod(){
  deleteManagedPeriodAt(managePeriodIdx);
}

function deleteManagedPeriodAt(idx){
  DATA[manageDay][manageGrade][idx]='';
  applyScheduleChange();
  managePeriodIdx=idx;
  var periodEl=document.getElementById('manage-period');
  if(periodEl) periodEl.value=String(idx);
  renderManageBody();
  syncManageInputsFromData();
}

function editManagedPeriod(idx){
  managePeriodIdx=idx;
  var periodEl=document.getElementById('manage-period');
  if(periodEl) periodEl.value=String(idx);
  syncManageInputsFromData();
}

function exportScheduleData(){
  var payload={version:APP_VERSION,author:APP_AUTHOR,exportedAt:new Date().toISOString(),data:DATA};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  a.download='ตารางสอน-โรงเรียนดอนสีนวน-'+todayIso()+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

function fillExportText(){
  var el=document.getElementById('schedule-import-text');
  if(el) el.value=JSON.stringify({version:APP_VERSION,author:APP_AUTHOR,data:DATA},null,2);
}

function importScheduleObject(obj){
  var incoming=obj && obj.data?obj.data:obj;
  DATA=normalizeScheduleData(incoming);
  applyScheduleChange();
  render();
  alert('นำเข้าข้อมูลตารางสอนแล้ว');
}

function importScheduleText(){
  var el=document.getElementById('schedule-import-text');
  try{
    importScheduleObject(JSON.parse(el.value));
  }catch(e){
    alert('นำเข้าไม่สำเร็จ: JSON ไม่ถูกต้อง');
  }
}

function importScheduleFile(input){
  var file=input.files && input.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      importScheduleObject(JSON.parse(reader.result));
    }catch(e){
      alert('นำเข้าไม่สำเร็จ: ไฟล์ JSON ไม่ถูกต้อง');
    }
    input.value='';
  };
  reader.readAsText(file);
}

function openScheduleImportFile(){
  var input=document.getElementById('schedule-import-file');
  if(input) input.click();
}

function resetScheduleData(){
  if(!confirm('ต้องการคืนค่าตารางสอนเริ่มต้นทั้งหมดหรือไม่?')) return;
  DATA=cloneScheduleData(DEFAULT_DATA);
  applyScheduleChange();
  render();
}

function buildLegend(){
  var base='<div class="legend"><div class="legend-item"><div class="legend-dot" style="background:var(--blue-lt);border:1px solid #b5d4f4"></div>ช่วงเช้า</div><div class="legend-item"><div class="legend-dot" style="background:var(--amber-lt);border:1px solid #f9cb75"></div>พักกลางวัน</div><div class="legend-item"><div class="legend-dot" style="background:var(--org-lt);border:1px solid #f9c28a"></div>ช่วงบ่าย</div>';
  if(mode==='teacher') return base+'<div class="legend-item"><div class="legend-dot" style="background:var(--blue-lt);border:1px solid #b5d4f4"></div>ป.</div><div class="legend-item"><div class="legend-dot" style="background:var(--purp-lt);border:1px solid #c9b8ef"></div>ม.</div></div>';
  return base+'<div class="legend-item"><div class="legend-dot" style="background:var(--purp-lt);border:1px solid #c9b8ef"></div>กิจกรรมพิเศษ</div></div>';
}

function buildFilterBar(){
  var fb=document.getElementById('filter-bar');
  if(mode==='sub'||mode==='manage'){fb.innerHTML='';fb.style.display='none';return;}
  fb.style.display='flex';
  var items=mode==='day'?DAYS:mode==='grade'?GRADES:ALL_TEACHERS;
  var label=mode==='day'?'วัน :':mode==='grade'?'ชั้น :':'ครู :';
  var h='<span class="filter-label">'+escapeHtml(label)+'</span>';
  items.forEach(function(item){
    h+='<button class="chip'+(item===selected?' active':'')+'" onclick=\'selectItem('+jsArg(item)+')\'>'+escapeHtml(item)+'</button>';
  });
  fb.innerHTML=h;
}

function render(){
  var content;
  if(mode==='day') content=buildDayView();
  else if(mode==='grade') content=buildGradeView();
  else if(mode==='teacher') content=buildTeacherView();
  else if(mode==='sub') content=buildSubView();
  else content=buildManageView();
  var mc=document.getElementById('main-content');
  var reportTools=(mode==='day'||mode==='grade'||mode==='teacher')?buildReportToolbar():'';
  mc.innerHTML=(mode==='sub'||mode==='manage'?'':reportTools+buildLegend())+content;
  if(mode==='sub') renderSubBody();
  if(mode==='manage') renderManageBody();
  buildFilterBar();
}

function setMode(m){
  mode=m;
  if(m==='day') selected='จันทร์';
  else if(m==='grade') selected='ป.1';
  else if(m==='teacher') selected=ALL_TEACHERS[0];
  else selected='';
  document.querySelectorAll('.mode-tab').forEach(function(el,i){
    el.classList.toggle('active',(i===0&&m==='day')||(i===1&&m==='grade')||(i===2&&m==='teacher')||(i===3&&m==='sub')||(i===4&&m==='manage'));
  });
  render();
}

function selectItem(item){selected=item;render();}
render();
